<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Beyond • Short Videos</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar">
<a class="brand" href="index.html">Beyond</a>
    <a class="nav-link discover-link" href="discover.html">🔥 Discover</a>
<nav class="nav-actions" aria-label="Beyond navigation">
<button id="openSearchBtn" class="nav-link search-link" type="button">🔍 Search</button>
      <button id="notificationsBtn" class="nav-link notifications-link" type="button">🔔 <span id="notificationBadge" class="notification-badge" hidden>0</span></button>
<a class="nav-link" href="profile.html">Profile</a>
<a class="upload-link" href="upload.html">＋ Upload</a>
</nav>
</header>
<div id="feedTabs" class="feed-tabs" role="tablist" aria-label="Video feed">
  <button id="forYouTab" class="feed-tab active" type="button" role="tab" aria-selected="true">For You</button>
  <button id="followingTab" class="feed-tab" type="button" role="tab" aria-selected="false">Following</button>
</div>
<section id="liveNowSection" class="live-now" hidden aria-label="Beyond Live now"><div class="live-now-header"><div><span class="live-now-kicker">BEYOND LIVE</span><h2>Live now</h2></div><a href="discover.html" class="live-now-link">Discover</a></div><div id="liveNowList" class="live-now-list"></div></section>
<main id="feed" class="feed"></main>
<div id="commentsOverlay" class="comments-overlay" hidden>
<section class="comments-panel" aria-label="Comments">
<header class="comments-header"><div><h2>Comments</h2><span id="commentsCount">0 comments</span></div><button id="closeCommentsBtn" class="close-search" type="button">×</button></header>
<div id="commentsList" class="comments-list"></div>
<form id="commentForm" class="comment-form"><input id="commentInput" maxlength="500" placeholder="Add a comment..." autocomplete="off"><button type="submit">Post</button></form>
</section></div>
<div id="searchOverlay" class="search-overlay" hidden>
<div class="search-panel">
<div class="search-panel-header"><h2>Search Beyond</h2><button id="closeSearchBtn" class="close-search" type="button">×</button></div>
<form id="homeSearchForm" class="home-search-form"><input id="homeSearchInput" type="search" maxlength="30" placeholder="Search creators..." autocomplete="off"><button type="submit">Search</button></form>
<p id="homeSearchStatus" class="status"></p><div id="homeSearchResults" class="creator-results"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="live-now.js"></script><script src="auth.js"></script><script src="feed.js"></script><script src="home-search.js"></script>
<div id="notificationsPanel" class="notifications-panel" hidden>
  <div class="notifications-card">
    <header class="notifications-header"><h2>Notifications</h2><button id="closeNotificationsBtn" class="close-search" type="button">×</button></header>
    <div id="notificationsList" class="notifications-list"></div>
  </div>
</div>
<script src="notifications.js"></script><script src="report.js"></script>
<div id="reportOverlay" class="report-overlay" hidden><section class="report-panel"><header class="report-header"><div><h2>Report video</h2><p>Tell us what is wrong with this video.</p></div><button id="closeReportBtn" class="close-search" type="button">×</button></header><form id="reportForm" class="report-form"><label for="reportReason">Reason</label><select id="reportReason" required><option value="">Choose a reason</option><option value="spam">Spam</option><option value="harassment">Harassment</option><option value="copyright">Copyright</option><option value="unsafe">Unsafe content</option><option value="other">Other</option></select><textarea id="reportDetails" maxlength="500" placeholder="Optional details"></textarea><button class="primary" type="submit">Submit report</button><p id="reportStatus" class="status" aria-live="polite"></p></form></section></div></body></html>
