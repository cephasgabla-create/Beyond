<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile • Beyond</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Beyond</a>
    <nav class="nav-actions">
      <a class="nav-link" href="index.html">Home</a>
      <a class="upload-link" href="upload.html">＋ Upload</a>
      <button id="logoutBtn" class="nav-link" type="button">Log out</button>
    </nav>
  </header>

  <main class="profile-page">
    <section class="profile-header">
      <div id="avatar" class="avatar">B</div>
      <div class="profile-main">
        <h1 id="profileName">Beyond Creator</h1>
        <p id="profileUsername" class="muted">@beyond</p>
        <p id="profileBio">Welcome to Beyond.</p>
        <div class="profile-stats">
          <span><strong id="videoCount">0</strong> Videos</span>
          <span><strong id="followerCount">0</strong> Followers</span>
          <span><strong id="followingCount">0</strong> Following</span>
        </div>
        <button id="followBtn" class="follow-btn" type="button" hidden>Follow</button>
      </div>
    </section>

    <section id="editSection" class="profile-edit">
      <h2>Edit profile</h2>
      <div class="profile-form">
        <label class="file-label" for="avatarInput">Profile photo</label>
        <input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp">
        <input id="usernameInput" maxlength="30" placeholder="Username">
        <input id="displayNameInput" maxlength="50" placeholder="Display name">
        <textarea id="bioInput" maxlength="150" placeholder="Bio"></textarea>
        <button id="saveProfileBtn" class="primary" type="button">Save profile</button>
        <p id="profileStatus" class="status" aria-live="polite"></p>
      </div>
    </section>

    <section>
      <h2>Videos</h2>
      <div id="myVideos" class="profile-grid">
        <p class="muted">Loading videos...</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
</body>
</html>
