<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in • Beyond</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="panel">
      <a class="brand" href="index.html">Beyond</a>
      <h1>Log in</h1>
      <p class="muted">Sign in to upload and share videos.</p>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginBtn" class="primary">Log in</button>
      <p id="authStatus" class="status" aria-live="polite"></p>

      <p class="muted">Don't have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="login.js"></script>
</body>
</html>
